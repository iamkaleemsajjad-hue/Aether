name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "30 6 * * 1"   # Weekly Monday 06:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dependency vulnerability audit ────────────────────────────────────────
  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      # --skip-editable: don't audit the local editable install itself
      # --ignore-vuln: ignore known false-positives from transitive deps
      # We use --desc (human-readable) but NOT --strict so one advisory
      # doesn't break the entire CI run — a report is still printed.
      - name: Audit Python dependencies
        run: |
          pip-audit --desc --skip-editable . || true
        continue-on-error: true

  # ── Static security analysis (Bandit) ────────────────────────────────────
  static-analysis:
    name: Static security analysis (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bandit[toml]"

      # -ll = only HIGH severity issues fail the build
      # -x   = exclude generated/vendored code
      - name: Run Bandit static analysis
        run: |
          bandit -r src/aether \
            -x "src/aether/__pycache__" \
            -ll \
            --format json \
            --output bandit-report.json || true
          bandit -r src/aether \
            -x "src/aether/__pycache__" \
            -ll
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          if-no-files-found: ignore

  # ── Package integrity check ───────────────────────────────────────────────
  package-smoke:
    name: Package smoke (build + twine check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: security-dist-packages
          path: dist/
          if-no-files-found: ignore
