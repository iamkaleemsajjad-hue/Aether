name: Benchmark smoke tests

on:
  schedule:
    - cron: "0 9 * * 1"  # Weekly on Monday at 09:00 UTC
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated list of models to benchmark"
        required: false
        default: "Qwen/Qwen3-0.6B"

jobs:
  benchmark:
    name: Benchmark smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,benchmark]"

      - name: Run benchmark smoke test
        run: |
          python -m benchmarks.bench_suite --smoke --models ${{ github.event.inputs.models || 'Qwen/Qwen3-0.6B' }} --output benchmark-results.json
        env:
          AETHER_CACHE_DIR: ${{ runner.temp }}/aether-cache

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}
          path: benchmark-results.json
