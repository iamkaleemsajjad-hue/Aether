name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/aether/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "GETTING_STARTED.md"
      - "SUPPORTED_MODELS.md"
      - "REQUIREMENTS.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Build the documentation HTML ──────────────────────────────────────────
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
          pip install markdown   # fallback renderer

      - name: Build Sphinx docs
        # --keep-going: collect all errors instead of stopping at first
        # No -W: warnings do NOT fail the build
        run: sphinx-build --keep-going -b html docs docs/_build/html || true

      - name: Ensure index.html exists (fallback)
        run: |
          if [ ! -f "docs/_build/html/index.html" ]; then
            echo "Sphinx did not produce index.html — generating fallback from README.md"
            mkdir -p docs/_build/html
            python - <<'PYEOF'
          import markdown, pathlib
          md = pathlib.Path("README.md").read_text(encoding="utf-8")
          html_body = markdown.markdown(
              md, extensions=["fenced_code", "tables", "toc"]
          )
          page = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Aether Runtime Documentation</title>
            <style>
              body {{ max-width: 900px; margin: 40px auto; font-family: system-ui, sans-serif;
                     padding: 0 24px; line-height: 1.6; color: #1a1a1a; }}
              pre {{ background: #f6f8fa; padding: 16px; border-radius: 6px; overflow-x: auto; }}
              code {{ background: #f6f8fa; padding: 2px 6px; border-radius: 3px; }}
              table {{ border-collapse: collapse; width: 100%; }}
              th, td {{ border: 1px solid #d0d7de; padding: 8px 12px; text-align: left; }}
              th {{ background: #f6f8fa; }}
            </style>
          </head>
          <body>{html_body}</body>
          </html>"""
          pathlib.Path("docs/_build/html/index.html").write_text(page, encoding="utf-8")
          print("Fallback index.html written from README.md")
          PYEOF
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # ── Deploy to GitHub Pages ────────────────────────────────────────────────
  # NOTE: This job requires GitHub Pages to be enabled in repository settings:
  #   Settings → Pages → Source → GitHub Actions
  # If Pages is not yet enabled, this job will fail but the build job above
  # will still succeed, so the docs artifact is always available for download.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
