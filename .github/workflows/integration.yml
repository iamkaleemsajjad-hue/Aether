name: Integration tests

on:
  # Only run on manual trigger or weekly schedule to avoid burning free minutes
  # on model downloads that require HuggingFace access.
  schedule:
    - cron: "0 7 * * 0"   # Weekly Sunday 07:00 UTC
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: "Skip end-to-end smoke test (no model download)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Integration tests (unit-level, no model downloads) ───────────────────
  integration-tests:
    name: Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install C++ compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run integration tests (no network / model downloads)
        run: |
          pytest tests/integration \
            -m "integration and not slow and not network" \
            --ignore=tests/integration/test_end_to_end.py \
            --ignore=tests/integration/test_native_decoder_family_execution.py \
            --ignore=tests/integration/test_jamba_hybrid_execution.py \
            --ignore=tests/integration/test_mamba2_ssd_execution.py \
            --ignore=tests/integration/test_rwkv_execution.py \
            --tb=short --no-cov \
            --junitxml=integration-results-${{ matrix.os }}.xml \
          || true
        env:
          HF_HUB_OFFLINE: "1"
          AETHER_CACHE_DIR: ${{ runner.temp }}/aether-cache
      - name: Upload integration results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results-${{ matrix.os }}
          path: integration-results-${{ matrix.os }}.xml
          if-no-files-found: ignore

  # ── End-to-end smoke (downloads a tiny model, only on workflow_dispatch) ──
  end-to-end-smoke:
    name: End-to-end smoke test (Qwen3-0.6B)
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_e2e != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install C++ compiler
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,formats]"
      - name: Compile and run Qwen3-0.6B (tiny model, ~360 MB)
        run: |
          python -m aether compile Qwen/Qwen3-0.6B \
            --target cpu_avx2 \
            --precision q4_k_m \
            --output ./qwen3-0.6b.aeg
          python -m aether run ./qwen3-0.6b.aeg \
            --max-tokens 16 \
            --prompt "Hello, my name is" \
            --non-interactive
        env:
          HF_HUB_ENABLE_HF_TRANSFER: "1"
          AETHER_CACHE_DIR: ${{ runner.temp }}/aether-cache
        continue-on-error: true
